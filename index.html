<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR Courrouze - Métro B & Bus C6</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-c6: #008855;
            --accent-b: #6b2d84;
            --alert-bg: #fff3cd;
            --alert-border: #ffeeba;
            --alert-text: #856404;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 12px 0;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #333;
        }

        header div {
            font-size: 0.9rem;
            color: #666;
            margin-top: 4px;
        }

        .alert-banner {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            color: var(--alert-text);
            padding: 12px;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
        }

        .alert-banner h3 {
            margin: 0 0 6px 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .line-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .line-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge-c6 { background-color: var(--accent-c6); }
        .badge-b { background-color: var(--accent-b); }

        .departures-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .departure-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .departure-item:last-child {
            border-bottom: none;
        }

        .real-time {
            color: #28a745;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .no-bus-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            display: block;
            text-align: center;
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-warning {
            background: #dc3545;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>STAR Courrouze</h1>
        <div>Temps réels &amp; Perturbations (GPS STAR)</div>
    </header>

    <!-- Zone des alertes globales -->
    <div id="alerts-container"></div>

    <!-- Carte Métro B -->
    <div class="line-card">
        <div class="line-header">
            <span class="badge badge-b">Métro B</span>
            <span id="metro-status">En service</span>
        </div>
        <ul class="departures-list" id="metro-departures">
            <li class="departure-item">Chargement des prochains passages...</li>
        </ul>
    </div>

    <!-- Carte Bus C6 -->
    <div class="line-card">
        <div class="line-header">
            <span class="badge badge-c6">Bus C6</span>
            <span id="c6-status">Vérification du flux GPS...</span>
        </div>
        <div id="c6-departures-container">
            <ul class="departures-list" id="c6-departures">
                <li class="departure-item">Vérification en direct...</li>
            </ul>
        </div>
    </div>

    <!-- Messages Rapides Parents -->
    <div class="line-card">
        <h3>💬 Messages Rapides Parents</h3>
        <div class="quick-actions">
            <a href="sms:?body=Je%20suis%20en%20route%20!" class="btn">📱 Je suis en route !</a>
            <a href="sms:?body=Attention%2C%20le%20bus%20est%20perturb%C3%A9%20ou%20supprim%C3%A9%20!" class="btn btn-warning">⚠️ Prévenir d'un problème de transport</a>
        </div>
    </div>

    <footer id="last-update">
        Mise à jour STAR en direct...
    </footer>
</div>

<script>
    // Configuration de l'API Open Data STAR (Rennes Métropole)
    const STAR_API_URL = "https://data.rennesmetropole.fr/api/records/1.0/search/";

    async function fetchStarData() {
        try {
            // 1. Récupération des positions GPS réelles des bus de la ligne C6
            const gpsResponse = await fetch(`${STAR_API_URL}?dataset=pos-bus&q=nomcourtligne:"C6"&rows=50`);
            const gpsData = await gpsResponse.json();

            // 2. Récupération des alertes perturbant le réseau
            const alertResponse = await fetch(`${STAR_API_URL}?dataset=vitaris-signalements-alertes-reseau-star-td&rows=10`);
            const alertData = await alertResponse.json();

            updateC6Display(gpsData.records, alertData.records);
            updateLastRefresh();
        } catch (error) {
            console.error("Erreur de récupération des données STAR:", error);
            // Si la requête échoue, on vérifie la règle d'heure locale (fin de service à 21h si pas de données)
            fallbackCheck();
        }
    }

    function updateC6Display(busRecords, alertRecords) {
        const departuresContainer = document.getElementById("c6-departures-container");
        const statusElement = document.getElementById("c6-status");
        const alertsContainer = document.getElementById("alerts-container");

        const now = new Date();
        const currentHour = now.getHours();

        // Filtrer les bus GPS actifs pour la ligne C6
        const activeBuses = busRecords ? busRecords.filter(r => r.fields && r.fields.nomcourtligne === 'C6') : [];

        // Détecter s'il y a une alerte de perturbation pour le C6
        const c6Alerts = alertRecords ? alertRecords.filter(a => a.fields && a.fields.titre && a.fields.titre.includes('C6')) : [];

        // Affichage des alertes en haut de page
        if (c6Alerts.length > 0) {
            alertsContainer.innerHTML = c6Alerts.map(a => `
                <div class="alert-banner">
                    <h3>⚠️ Perturbation C6</h3>
                    <div>${a.fields.description || a.fields.titre}</div>
                </div>
            `).join('');
        }

        // RÈGLE MÉTIER TEMPS RÉEL :
        // Si aucun bus GPS n'est détecté OU si l'heure dépasse 21h sans bus actif en circulation
        if (activeBuses.length === 0 || (currentHour >= 21 && activeBuses.length === 0)) {
            statusElement.innerText = "Service Terminé / Interrompu";
            statusElement.style.color = "#dc3545";
            
            departuresContainer.innerHTML = `
                <div class="no-bus-message">
                    🚫 Aucun bus C6 ne circule actuellement (Fin de service ou déviation).
                </div>
            `;
        } else {
            statusElement.innerText = "En service (GPS actif)";
            statusElement.style.color = "#28a745";

            // Calculer / Afficher les bus réellement suivis en GPS
            let html = '<ul class="departures-list">';
            activeBuses.slice(0, 3).forEach((bus, index) => {
                const destination = bus.fields.destination || "Courrouze / Cesson";
                html += `
                    <li class="departure-item">
                        <span>Direction <strong>${destination}</strong></span>
                        <span class="real-time">📡 Bus en route (GPS)</span>
                    </li>
                `;
            });
            html += '</ul>';
            departuresContainer.innerHTML = html;
        }
    }

    function fallbackCheck() {
        const now = new Date();
        if (now.getHours() >= 21) {
            document.getElementById("c6-status").innerText = "Service Terminé";
            document.getElementById("c6-departures-container").innerHTML = `
                <div class="no-bus-message">
                    🚫 Aucun bus C6 disponible après 21h.
                </div>
            `;
        }
    }

    function updateLastRefresh() {
        const now = new Date();
        document.getElementById("last-update").innerText = `Dernière synchronisation GPS : ${now.toLocaleTimeString()}`;
    }

    // Lancement et rafraîchissement automatique toutes les 30 secondes
    fetchStarData();
    setInterval(fetchStarData, 30000);
</script>

</body>
</html>
