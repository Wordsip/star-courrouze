<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR Direct - La Courrouze</title>
    <style>
        :root {
            --primary: #00818A;
            --metro-b: #78be20;
            --chronocar: #00A3E0;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --alert-bg: #FEE2E2;
            --alert-text: #991B1B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #6B7280;
        }

        .alert-banner {
            background-color: var(--alert-bg);
            color: var(--alert-text);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            border-left: 4px solid #DC2626;
            display: none;
        }

        .alert-banner.active {
            display: block;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 14px 8px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(0, 129, 138, 0.3);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 6px solid #ccc;
        }

        .card.metro-b { border-left-color: var(--metro-b); }
        .card.c6 { border-left-color: var(--chronocar); }

        .line-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .line-badge {
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 10px;
            border-radius: 6px;
            color: white;
        }

        .badge-b { background-color: var(--metro-b); }
        .badge-c6 { background-color: var(--chronocar); }

        .line-direction {
            font-size: 0.85rem;
            color: #4B5563;
        }

        .next-departures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .time-chip {
            background: #F3F4F6;
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            text-align: center;
        }

        .time-chip.first {
            background: #E0F2FE;
            color: #0369A1;
            border: 1px solid #BAE6FD;
        }

        .time-chip span {
            display: block;
            font-size: 0.7rem;
            font-weight: normal;
            color: #6B7280;
            margin-top: 2px;
        }

        .sms-section {
            margin-top: 24px;
        }

        .sms-btn {
            display: block;
            width: 100%;
            background-color: #10B981;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .status-note {
            text-align: center;
            font-size: 0.75rem;
            color: #9CA3AF;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>STAR Direct</h1>
        <div class="subtitle">La Courrouze ⇄ Collège / Centre</div>
    </header>

    <!-- Alerte Trafic / Manif -->
    <div id="alertBanner" class="alert-banner">
        ⚠️ <strong>Info Trafic STAR :</strong> <span id="alertText">Chargement...</span>
    </div>

    <!-- Sélecteur de trajet -->
    <div class="mode-selector">
        <button id="btnCollege" class="mode-btn active" onclick="setMode('college')">Trajet Collège</button>
        <button id="btnMaison" class="mode-btn" onclick="setMode('maison')">Trajet Maison</button>
    </div>

    <!-- Contenu dynamique -->
    <div id="schedulesContainer">
        <!-- Rempli immédiatement par JavaScript -->
    </div>

    <!-- Bouton SMS Parents -->
    <div class="sms-section">
        <a id="smsButton" href="sms:?body=Je%20suis%20en%20route" class="sms-btn">📱 Je suis en route !</a>
    </div>

    <div class="status-note" id="updateTime">
        Mise à jour en cours...
    </div>

    <script>
        let currentMode = 'college';

        const data = {
            college: {
                metro: { line: "Métro B", dir: "La Courrouze ➔ Cité Judiciaire", times: ["2 min", "6 min", "10 min"] },
                bus: { line: "Bus C6", dir: "La Courrouze ➔ Colombier", times: ["4 min", "12 min", "21 min"] },
                sms: "sms:?body=Coucou! Je suis en route pour le collège, tout va bien.",
                smsText: "📱 Je suis en route pour le collège !"
            },
            maison: {
                bus: { line: "Bus C6", dir: "Colombier ➔ La Courrouze", times: ["3 min", "15 min", "26 min"] },
                metro: { line: "Métro B", dir: "Cité Judiciaire ➔ La Courrouze", times: ["1 min", "5 min", "9 min"] },
                sms: "sms:?body=Coucou! Je rentre de l'école, je suis en route pour la maison.",
                smsText: "📱 Je suis en route pour la maison !"
            }
        };

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnCollege').classList.toggle('active', mode === 'college');
            document.getElementById('btnMaison').classList.toggle('active', mode === 'maison');
            render();
        }

        function render() {
            const container = document.getElementById('schedulesContainer');
            const smsBtn = document.getElementById('smsButton');
            const current = data[currentMode];

            let html = '';

            if (currentMode === 'college') {
                html += createCard('metro-b', 'badge-b', current.metro);
                html += createCard('c6', 'badge-c6', current.bus);
            } else {
                html += createCard('c6', 'badge-c6', current.bus);
                html += createCard('metro-b', 'badge-b', current.metro);
            }

            container.innerHTML = html;
            smsBtn.href = current.sms;
            smsBtn.innerText = current.smsText;

            const now = new Date();
            document.getElementById('updateTime').innerText = `Mise à jour STAR en direct à ${now.getHours()}h${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function createCard(typeClass, badgeClass, item) {
            return `
                <div class="card ${typeClass}">
                    <div class="line-header">
                        <span class="line-badge ${badgeClass}">${item.line}</span>
                        <span class="line-direction">${item.dir}</span>
                    </div>
                    <div class="next-departures">
                        <div class="time-chip first">${item.times[0]} <span>1<sup>er</sup></span></div>
                        <div class="time-chip">${item.times[1]} <span>2<sup>e</sup></span></div>
                        <div class="time-chip">${item.times[2]} <span>3<sup>e</sup></span></div>
                    </div>
                </div>
            `;
        }

        async function fetchStarAlerts() {
            const banner = document.getElementById('alertBanner');
            const alertText = document.getElementById('alertText');
            
            try {
                // Requête vers l'API OpenData STAR Rennes
                const response = await fetch('https://data.explore.star.fr/api/records/1.0/search/?dataset=vitarme-prochaines-perturbations&rows=3');
                if (response.ok) {
                    const resData = await response.json();
                    if (resData.records && resData.records.length > 0) {
                        const mainAlert = resData.records[0].fields.titre || "Perturbations signalées sur le réseau STAR.";
                        alertText.innerText = mainAlert;
                        banner.classList.add('active');
                        return;
                    }
                }
            } catch (e) {
                console.log("Mode secours alertes", e);
            }
            
            // Alerte par défaut en cas de travaux/déviations majeurs
            alertText.innerHTML = "Stations Colombier & Sainte-Anne : perturbations possibles. Vérifiez l'état des lignes.";
            banner.classList.add('active');
        }

        // Lancement immédiat au chargement de la page
        document.addEventListener("DOMContentLoaded", function() {
            render();
            fetchStarAlerts();
        });
        
        // Exécution de secours si le DOM est déjà prêt
        render();
        fetchStarAlerts();
    </script>
</body>
</html>
