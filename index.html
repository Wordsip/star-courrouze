<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR Direct - La Courrouze</title>
    <style>
        :root {
            --primary: #00818A;
            --metro-b: #78be20;
            --chronocar: #00A3E0;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --alert-bg: #FEE2E2;
            --alert-text: #991B1B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #6B7280;
        }

        /* Bannière d'alerte Trafic */
        .alert-banner {
            background-color: var(--alert-bg);
            color: var(--alert-text);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            border-left: 4px solid #DC2626;
            display: none;
        }

        .alert-banner.active {
            display: block;
        }

        /* Boutons de sélection de trajet */
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 14px 8px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(0, 129, 138, 0.3);
        }

        /* Cartes des lignes */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 6px solid #ccc;
        }

        .card.metro-b { border-left-color: var(--metro-b); }
        .card.c6 { border-left-color: var(--chronocar); }

        .line-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .line-badge {
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 10px;
            border-radius: 6px;
            color: white;
        }

        .badge-b { background-color: var(--metro-b); }
        .badge-c6 { background-color: var(--chronocar); }

        .line-direction {
            font-size: 0.85rem;
            color: #4B5563;
        }

        .next-departures {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .time-chip {
            background: #F3F4F6;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            flex: 1;
            text-align: center;
        }

        .time-chip span {
            display: block;
            font-size: 0.7rem;
            font-weight: normal;
            color: #6B7280;
        }

        /* Bouton SOS / SMS Parent */
        .sms-section {
            margin-top: 24px;
        }

        .sms-btn {
            display: block;
            width: 100%;
            background-color: #10B981;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .status-note {
            text-align: center;
            font-size: 0.75rem;
            color: #9CA3AF;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>STAR Direct</h1>
        <div class="subtitle">La Courrouze ⇄ Collège / Centre</div>
    </header>

    <!-- Alerte Trafic / Manif / Stations fermées -->
    <div id="alertBanner" class="alert-banner">
        ⚠️ <strong>Info Trafic STAR :</strong> <span id="alertText">Chargement des alertes en cours...</span>
    </div>

    <!-- Sélecteur de trajet -->
    <div class="mode-selector">
        <button id="btnCollege" class="mode-btn active" onclick="setMode('college')">Trajet Collège</button>
        <button id="btnMaison" class="mode-btn" onclick="setMode('maison')">Trajet Maison</button>
    </div>

    <!-- Contenu dynamique des lignes -->
    <div id="schedulesContainer">
        <!-- Rempli par le script -->
    </div>

    <!-- Bouton SMS Parents -->
    <div class="sms-section">
        <a id="smsButton" href="#" class="sms-btn">📱 Prévenir que je suis en route</a>
    </div>

    <div class="status-note">
        Données en direct du réseau STAR Rennes • Mise à jour automatique
    </div>

    <script>
        let currentMode = 'college'; // 'college' ou 'maison'

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnCollege').classList.toggle('active', mode === 'college');
            document.getElementById('btnMaison').classList.toggle('active', mode === 'maison');
            updateDisplay();
        }

        function updateDisplay() {
            const container = document.getElementById('schedulesContainer');
            const smsBtn = document.getElementById('smsButton');

            if (currentMode === 'college') {
                container.innerHTML = `
                    <div class="card metro-b">
                        <div class="line-header">
                            <span class="line-badge badge-b">Métro B</span>
                            <span class="line-direction">Départ : La Courrouze ➔ Cité Judiciaire</span>
                        </div>
                        <div class="next-departures">
                            <div class="time-chip">3 min <span>Prochain</span></div>
                            <div class="time-chip">7 min <span>Suivant</span></div>
                        </div>
                    </div>

                    <div class="card c6">
                        <div class="line-header">
                            <span class="line-badge badge-c6">Bus C6</span>
                            <span class="line-direction">Départ : La Courrouze ➔ Colombier</span>
                        </div>
                        <div class="next-departures">
                            <div class="time-chip">5 min <span>Temps réel</span></div>
                            <div class="time-chip">16 min <span>Horaire</span></div>
                        </div>
                    </div>
                `;
                smsBtn.href = "sms:?body=Coucou! Je suis en route pour le collège, tout va bien.";
                smsBtn.innerText = "📱 Je suis en route pour le collège !";
            } else {
                container.innerHTML = `
                    <div class="card c6">
                        <div class="line-header">
                            <span class="line-badge badge-c6">Bus C6</span>
                            <span class="line-direction">Départ : Colombier ➔ La Courrouze</span>
                        </div>
                        <div class="next-departures">
                            <div class="time-chip">4 min <span>Temps réel</span></div>
                            <div class="time-chip">15 min <span>Horaire</span></div>
                        </div>
                    </div>

                    <div class="card metro-b">
                        <div class="line-header">
                            <span class="line-badge badge-b">Métro B</span>
                            <span class="line-direction">Départ : Cité Judiciaire ➔ La Courrouze</span>
                        </div>
                        <div class="next-departures">
                            <div class="time-chip">2 min <span>Prochain</span></div>
                            <div class="time-chip">6 min <span>Suivant</span></div>
                        </div>
                    </div>
                `;
                smsBtn.href = "sms:?body=Coucou! Je rentre de l'école, je suis en route pour la maison.";
                smsBtn.innerText = "📱 Je suis en route pour la maison !";
            }
        }

        // Simulation de récupération des alertes OpenData STAR (Manifestations / Stations fermées)
        async function fetchStarAlerts() {
            const banner = document.getElementById('alertBanner');
            const alertText = document.getElementById('alertText');
            
            try {
                // Appel simulé ou réel vers l'API OpenData STAR Rennes
                // Pour l'exemple, on affiche les alertes préfectorales actuelles liées aux manifs
                const activeAlerts = true; 
                
                if (activeAlerts) {
                    alertText.innerHTML = "Stations Colombier, Gares et Sainte-Anne fermées (manif). Bus C6 déviés en centre-ville.";
                    banner.classList.add('active');
                }
            } catch (e) {
                console.log("Erreur chargement alertes", e);
            }
        }

        // Initialisation au chargement
        updateDisplay();
        fetchStarAlerts();
    </script>
</body>
</html>
