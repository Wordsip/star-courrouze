<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR Direct - La Courrouze</title>
    <style>
        :root {
            --primary: #00818A;
            --metro-b: #78be20;
            --chronocar: #00A3E0;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --alert-bg: #FEE2E2;
            --alert-text: #991B1B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #6B7280;
        }

        .alert-banner {
            background-color: var(--alert-bg);
            color: var(--alert-text);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            border-left: 4px solid #DC2626;
            display: none;
        }

        .alert-banner.active {
            display: block;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 14px 8px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(0, 129, 138, 0.3);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 6px solid #ccc;
        }

        .card.metro-b { border-left-color: var(--metro-b); }
        .card.c6 { border-left-color: var(--chronocar); }

        .line-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .line-badge {
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 10px;
            border-radius: 6px;
            color: white;
        }

        .badge-b { background-color: var(--metro-b); }
        .badge-c6 { background-color: var(--chronocar); }

        .line-direction {
            font-size: 0.85rem;
            color: #4B5563;
        }

        /* Grille ajustée pour 3 départs */
        .next-departures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .time-chip {
            background: #F3F4F6;
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            text-align: center;
        }

        .time-chip.first {
            background: #E0F2FE;
            color: #0369A1;
            border: 1px solid #BAE6FD;
        }

        .time-chip span {
            display: block;
            font-size: 0.7rem;
            font-weight: normal;
            color: #6B7280;
            margin-top: 2px;
        }

        .sms-section {
            margin-top: 24px;
        }

        .sms-btn {
            display: block;
            width: 100%;
            background-color: #10B981;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129,
